# Produção no jv-server: o Caddy compartilhado (~/caddy/Caddyfile) encontra o site pelo alias prismaassist-site
# na rede infra_default e termina o TLS de prismaassist.com e www.prismaassist.com. Nenhuma porta no host.
#   docker compose up -d --build
name: prismaassist-site

services:
  site:
    build: .
    image: prismaassist-site
    container_name: prismaassist_site
    restart: unless-stopped
    mem_limit: 64m
    networks:
      infra_default:
        aliases:
          - prismaassist-site

networks:
  infra_default:
    external: true
